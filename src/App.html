    .withSuccessHandler(resolve)
    .withFailureHandler(e => reject(e instanceof Error ? e : new Error(e && e.message ? e.message : String(e))))

});

// ---------------------------------------------------------------- estado ---
const S = {

  form: null          // estado do formulário de contrato
};

const ROUTES = [
  { id: 'inicio', label: 'Visão geral', short: 'Início', icon: 'home' },
  { id: 'agenda', label: 'Agenda e prazos', short: 'Agenda', icon: 'clock' },
  { id: 'clientes', label: 'Clientes', icon: 'users' },

  { id: 'ajustes', label: 'Ajustes', icon: 'gear' }
];
const TABS = ['inicio', 'agenda', 'clientes', 'recebiveis'];

// ------------------------------------------------------------- utilidades ---
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = v => BRL.format(Number(v) || 0);
const brlShort = v => {
  v = Number(v) || 0;
  if (v >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (v >= 1e4) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
  return 'R$ ' + Math.round(v).toLocaleString('pt-BR');
};
const pad = n => String(n).padStart(2, '0');
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MES3 = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const today = () => {
  if (S.meta.hoje) return S.meta.hoje;
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const fmtDate = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : 'sem data';
const monthKey = iso => (iso || '').slice(0, 7);
const monthLabel = key => { if (!key) return 'Sem data definida'; const m = MESES[+key.slice(5, 7) - 1]; return `${m[0].toUpperCase()}${m.slice(1)} de ${key.slice(0, 4)}`; };
const addMonths = (iso, n) => {
  const [y, m, d] = iso.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  return `${first.getUTCFullYear()}-${pad(first.getUTCMonth() + 1)}-${pad(Math.min(d || 1, last))}`;
};
const parseMoney = s => {
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/[R$\s]/g, '');
  if (!s) return null;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isNaN(n) ? null : Math.round(n * 100) / 100;
};
const moneyIn = v => (v == null || v === '') ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f ? f(x) : x) || 0), 0);
const initials = n => String(n || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const waLink = num => {
  let d = String(num || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d;
};
const fmtPhone = num => {
  const d = String(num || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return num || '';
};
const fmtSize = b => !b ? '' : b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1024 / 1024).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

// ------------------------------------------------------------- consultas ---
const T = t => S.tables[t];
const byId = (t, id) => T(t).find(r => r.id === id);
const clienteNome = id => (byId('clientes', id) || {}).nome || 'Cliente removido';
const produtoNome = id => (byId('produtos', id) || {}).nome || 'Sem produto';
const campanhaNome = id => (byId('campanhas', id) || {}).nome || '';
const parcelasDe = contratoId => T('parcelas').filter(p => p.contrato_id === contratoId).sort((a, b) => (a.numero || 0) - (b.numero || 0));
const contratosDe = clienteId => T('contratos').filter(c => c.cliente_id === clienteId).sort((a, b) => (b.data_fechamento || '').localeCompare(a.data_fechamento || ''));
const contratoValido = c => c && c.status !== 'cancelado';
const parcelaAtiva = p => !p.contrato_id || contratoValido(byId('contratos', p.contrato_id));

function statusParcela(p) {
  if (p.status === 'paga') return 'paga';
  if (p.vencimento && p.vencimento < today()) return 'atrasada';
  if (p.tipo === 'estimada') return 'estimada';
  return 'prevista';
}
function badgeParcela(p) {
  const s = statusParcela(p);
  const map = {
    paga: ['b-ok', 'Recebida'],
    atrasada: ['b-late', 'Atrasada'],
    estimada: ['b-est', 'Data prevista'],
    prevista: ['b-plan', 'A receber']
  };
  return `<span class="badge ${map[s][0]}">${map[s][1]}</span>`;
}
const pendentes = () => T('parcelas').filter(p => p.status !== 'paga' && parcelaAtiva(p));
const aReceberCliente = id => sum(contratosDe(id).filter(contratoValido).flatMap(c => parcelasDe(c.id)).concat(T('parcelas').filter(p => !p.contrato_id && p.cliente_id === id)).filter(p => p.status !== 'paga'), p => p.valor);

const PERIODOS = [['mes', 'Este mês'], ['3m', '3 meses'], ['12m', '12 meses'], ['ano', 'Este ano'], ['tudo', 'Tudo']];
function rangeOf(p) {
  const t = today(), first = t.slice(0, 8) + '01', end = t.slice(0, 7) + '-31';
  switch (p) {
    case 'mes': return [first, end];
    case '3m': return [addMonths(first, -2), end];
    case '12m': return [addMonths(first, -11), end];
    case 'ano': return [t.slice(0, 4) + '-01-01', t.slice(0, 4) + '-12-31'];
    default: return ['0000-00-00', '9999-12-31'];
  }
}
const inRange = (d, r) => !!d && d >= r[0] && d <= r[1];

// ---------------------------------------------------- gravação (otimista) ---
function upsertLocal(t, rec) {
  const arr = T(t), i = arr.findIndex(r => r.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
}
function track(promise) {
  S.pending++; syncUI();
  return promise
    .then(r => { S.failed = false; return r; })
    .catch(err => {
      S.failed = true;
      toast('Não foi possível salvar: ' + (err.message || err) + '. Recarreguei os dados.', true);
      reload();
      return null;
    })
    .finally(() => { S.pending--; syncUI(); });
}
function save(t, rec) {
  upsertLocal(t, rec); rerender();
  return track(call('api_save', t, rec)).then(saved => {
    if (saved) { upsertLocal(t, saved); rerender(); }
    return saved;
  });
}
function saveContrato(c, parcelas, waitFor) {
  upsertLocal('contratos', c);
  S.tables.parcelas = T('parcelas').filter(p => p.contrato_id !== c.id).concat(parcelas);
  rerender();
  // Se o cliente/serviço acabou de ser criado, espera ele chegar ao servidor (a pasta do processo fica dentro da do cliente).
  return track(Promise.resolve(waitFor).then(() => call('api_saveContrato', c, parcelas))).then(r => {
    if (r) {
      upsertLocal('contratos', r.contrato);
      S.tables.parcelas = T('parcelas').filter(p => p.contrato_id !== c.id).concat(r.parcelas);
      rerender();
    }
    return r;
  });
}
function remove(t, id) {
  if (t === 'clientes') {
    const cids = contratosDe(id).map(c => c.id);
    S.tables.parcelas = T('parcelas').filter(p => cids.indexOf(p.contrato_id) < 0);
    S.tables.contratos = T('contratos').filter(c => c.cliente_id !== id);
  }
  if (t === 'clientes') S.tables.prazos = T('prazos').filter(z => z.cliente_id !== id);
  if (t === 'contratos') { S.tables.parcelas = T('parcelas').filter(p => p.contrato_id !== id); S.tables.prazos = T('prazos').filter(z => z.contrato_id !== id); }
  S.tables[t] = T(t).filter(r => r.id !== id);
  rerender();
  return track(call('api_delete', t, id));
}
function reload() {
  return call('api_bootstrap').then(d => {
    S.tables = d.tables; S.config = d.config; S.meta = d.meta; S.ready = true;
    rerender();
  });
}

// --------------------------------------------------------------- interface ---
function syncUI() {
  const el = $('#sync');
  el.className = 'sync' + (S.pending ? ' busy' : S.failed ? ' err' : '');
  el.lastElementChild.textContent = S.pending ? 'Salvando…' : S.failed ? 'Erro ao salvar' : 'Tudo salvo';
}
let toastTimer;
function toast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, isErr ? 6000 : 2600);
}

function renderChrome() {
  const navRoute = SUBPAGES[S.route] || S.route;
  $('#nav').innerHTML = ROUTES.map(r =>
    (r.sep ? '<div class="nav-sep"></div>' : '') +
    `<button type="button" data-action="go" data-route="${r.id}" ${navRoute === r.id ? 'aria-current="page"' : ''}>${ic(r.icon)}<span>${r.label}</span></button>`
  ).join('');
  const onTab = TABS.indexOf(navRoute) >= 0;
  $('#tabbar').innerHTML = TABS.map(id => {
    const r = ROUTES.find(x => x.id === id);
    return `<button type="button" data-action="go" data-route="${id}" ${navRoute === id ? 'aria-current="page"' : ''}>${ic(r.icon)}<span>${r.short || r.label}</span></button>`;
  }).join('') + `<button type="button" data-action="more" ${onTab ? '' : 'aria-current="page"'}>${ic('more')}<span>Mais</span></button>`;
  const route = ROUTES.find(r => r.id === S.route);
  $('#title').textContent = route ? route.label : '';
  $('#foot').textContent = S.meta.version ? 'Versão ' + S.meta.version : '';
}

function rerender() {
  if (!S.ready) return;
  renderChrome();
  const views = { agenda: vAgenda, cliente: vCliente, processo: vProcesso, inicio: vInicio, clientes: vClientes, contratos: vContratos, recebiveis: vRecebiveis, gastos: vGastos, campanhas: vCampanhas, produtos: vProdutos, ajustes: vAjustes };
  $('#view').innerHTML = views[S.route]();
  if (S.drawer && S.drawer.live) paintDrawer();
}

function go(route) {
  S.route = route;
  closeDrawer();
  rerender();
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- gaveta ---
function openDrawer(render, live) {
  S.drawer = { render, live: !!live };
  $('#drawer').innerHTML = '';
  paintDrawer();
  $('#shell').classList.add('open');

function field(name, label, type, value, o = {}) {
  const v = value == null ? '' : value;
  const cls = 'field' + (o.full ? ' full' : '');
  const req = o.required ? ' required' : '';
  const hint = o.hint ? `<span class="hint">${o.hint}</span>` : '';
  const id = 'f-' + name;
  if (type === 'select') {
    const opts = (o.options || []).map(op => {
      const [val, lab] = Array.isArray(op) ? op : [op, op];
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
    }).join('');
    return `<div class="${cls}"><label for="${id}">${label}</label><select id="${id}" name="${name}"${req}>${opts}</select>${hint}</div>`;
  }
  if (type === 'textarea') return `<div class="${cls}"><label for="${id}">${label}</label><textarea id="${id}" name="${name}" placeholder="${esc(o.placeholder || '')}">${esc(v)}</textarea>${hint}</div>`;
  if (type === 'money') return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" name="${name}" data-money inputmode="decimal" placeholder="0,00" value="${esc(moneyIn(v))}"${req}>${hint}</div>`;
  return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" name="${name}" type="${type}" value="${esc(v)}" placeholder="${esc(o.placeholder || '')}"${o.autofocus ? ' autofocus' : ''}${req}${type === 'tel' ? ' inputmode="tel"' : ''}>${hint}</div>`;
}
function seg(name, value, options) {
  return `<div class="seg" data-seg="${name}">${options.map(([v, l]) =>
    `<button type="button" data-action="seg" data-name="${name}" data-value="${esc(v)}" aria-pressed="${String(v) === String(value)}">${l}</button>`).join('')}</div>`;
}
function readForm(root) {
  const out = {};
  root.querySelectorAll('[name]').forEach(el => {
    out[el.name] = el.hasAttribute('data-money') ? parseMoney(el.value) : el.value.trim();
  });
  root.querySelectorAll('[data-seg]').forEach(s => {
    const on = s.querySelector('[aria-pressed="true"]');
    out[s.dataset.seg] = on ? on.dataset.value : '';
  });
  return out;
}
function invalid(el, msg) {

  if (el) el.focus();

const SEM_ANUNCIO = ['Orgânico', 'Indicação'];
const isPaga = c => SEM_ANUNCIO.indexOf(c.plataforma) < 0;
const sortCamps = list => list.slice().sort((a, b) => (isPaga(a) - isPaga(b)) || ((a.status === 'encerrada') - (b.status === 'encerrada')) || a.nome.localeCompare(b.nome, 'pt-BR'));
/** Origem de um processo/cliente: orgânico, indicação ou uma campanha paga. */
const optOrigem = () => [['', 'Não informado']].concat(sortCamps(T('campanhas')).map(c => [c.id, c.nome]));
/** Gastos só se ligam a campanhas pagas. */
const optCampanhas = () => [['', 'Sem campanha']].concat(sortCamps(T('campanhas').filter(isPaga)).map(c => [c.id, c.nome]));
const optList = key => (S.config[key] || []).map(x => [x, x]);

/* =========================================================================
   ÁRVORE DE GASTOS (tipo → área → serviço, ou área → serviço → tipo)
   ========================================================================= */
const GERAL = 'Geral do escritório';
const servicoDoGasto = g => g.produto_id || (byId('campanhas', g.campanha_id) || {}).produto_id || '';
const areaDoServico = id => { const p = byId('produtos', id); return p ? (p.area || 'Outro') : ''; };
const AGRUPAR = [['tipo', 'Por tipo de gasto'], ['servico', 'Por área e serviço']];

function arvoreGastos(gastos, modo, contr) {
  const root = { n: '', v: 0, kids: {} };
  const add = (path, valor) => {
    let node = root; root.v += valor;
    path.filter(Boolean).forEach(seg => {
      node.kids[seg] = node.kids[seg] || { n: seg, v: 0, kids: {} };
      node = node.kids[seg]; node.v += valor;
    });
  };
  gastos.forEach(g => {
    const sid = servicoDoGasto(g);
    const area = areaDoServico(sid) || GERAL;
    const serv = sid ? produtoNome(sid) : '';
    const cat = g.categoria || 'Outro';
    add(modo === 'servico' ? [area, serv, cat] : [cat, area, serv], Number(g.valor) || 0);
  });
  // Na visão por serviço, serviços com processos mas sem gasto também aparecem (retorno do orgânico/indicação).
  if (modo === 'servico') (contr || []).forEach(k => add([areaDoServico(k.produto_id) || GERAL, produtoNome(k.produto_id)], 0));
  return root;
}

function tabelaArvore(gastos, modo, contr, compact) {
  const root = arvoreGastos(gastos, modo, contr);
  if (!Object.keys(root.kids).length) return '';
  const total = root.v || 1;
  const comRetorno = modo === 'servico' && !compact;
  const rows = [];
  const walk = (node, depth, parents) => Object.values(node.kids)
    .filter(k => !compact || k.v)
    .sort((a, b) => ((a.n === GERAL) - (b.n === GERAL)) || b.v - a.v || a.n.localeCompare(b.n, 'pt-BR'))
    .forEach(k => { rows.push({ k, depth, parents }); walk(k, depth + 1, parents.concat(k.n)); });
  walk(root, 0, []);
  const ret = (r) => {
    if (!comRetorno || r.depth > 1) return '<td></td><td></td>';
    const ks = contr.filter(k => (areaDoServico(k.produto_id) || GERAL) === (r.depth === 0 ? r.k.n : r.parents[0]) && (r.depth === 0 || produtoNome(k.produto_id) === r.k.n));
    return `<td class="r num" data-l="Processos">${ks.length || '—'}</td><td class="r num" data-l="Contratado">${ks.length ? brl(sum(ks, k => k.valor_total)) : '—'}</td>`;
  };
  return `<table class="table tree${compact ? ' compact' : ''}"><thead><tr>
      <th>${modo === 'servico' ? 'Área / serviço / tipo de gasto' : 'Tipo de gasto / área / serviço'}</th><th class="r">Investido</th>${compact ? '' : '<th class="r">% do total</th>'}${comRetorno ? '<th class="r">Processos</th><th class="r">Contratado</th>' : ''}
    </tr></thead><tbody>
    ${rows.map(r => `<tr class="lvl-${r.depth}">
      <td><span class="tree-name" style="padding-left:${r.depth * 20}px">${esc(r.k.n)}</span>${r.depth < 2 && r.k.v ? `<div class="track" style="margin-left:${r.depth * 20}px"><div class="fill" style="width:${(r.k.v / total * 100).toFixed(1)}%"></div></div>` : ''}</td>
      <td class="r num">${r.k.v ? brl(r.k.v) : '—'}</td>
      ${compact ? '' : `<td class="r num">${r.k.v ? (r.k.v / total * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : ''}</td>`}
      ${comRetorno ? ret(r) : ''}
    </tr>`).join('')}
    </tbody></table>`;
}
const segAgrupar = () => `<div class="seg seg-inline" role="group" aria-label="Agrupar">${AGRUPAR.map(([v, l]) => `<button type="button" data-action="agrupar" data-v="${v}" aria-pressed="${S.gasto.agrupar === v}">${l}</button>`).join('')}</div>`;

/* =========================================================================
   VISÃO GERAL
   ========================================================================= */
function vInicio() {
  const t = today();
  const pend = pendentes();
  const atrasadas = pend.filter(p => p.vencimento && p.vencimento < t);
  const r = rangeOf(S.periodo);

  // ---- faixa dos próximos meses
  const startKey = monthKey(t);
  const PASSADOS = 3;
  const months = Array.from({ length: 12 + PASSADOS }, (_, i) => monthKey(addMonths(t.slice(0, 8) + '01', i - PASSADOS)));
  const pagas = T('parcelas').filter(p => p.status === 'paga' && parcelaAtiva(p));
  const recebidoMes = k => sum(pagas.filter(p => monthKey(p.data_pagamento || p.vencimento) === k), p => p.valor);
  const cols = [];
  const late = sum(atrasadas, p => p.valor);
  months.forEach((k, i) => {
    const ps = k < startKey ? [] : pend.filter(p => monthKey(p.vencimento) === k && !(p.vencimento < t));
    const y = k.slice(0, 4), m = +k.slice(5, 7);
    if (k === startKey && late > 0) cols.push({ key: 'late', label: '<b>Atrasado</b>', late, fix: 0, est: 0, ok: 0 });
    cols.push({
      key: k, now: k === startKey, past: k < startKey,
      label: (i === 0 || m === 1 || k === startKey) ? `${MES3[m - 1]} <b>${y.slice(2)}</b>` : MES3[m - 1],
      ok: k <= startKey ? recebidoMes(k) : 0,
      fix: sum(ps.filter(p => p.tipo !== 'estimada'), p => p.valor),
      est: sum(ps.filter(p => p.tipo === 'estimada'), p => p.valor),
      late: 0
    });
  });
  const lastKey = months[months.length - 1];
  const depois = pend.filter(p => !p.vencimento || monthKey(p.vencimento) > lastKey);
  if (depois.length) cols.push({ key: 'depois', label: 'Depois', fix: sum(depois.filter(p => p.tipo !== 'estimada'), p => p.valor), est: sum(depois.filter(p => p.tipo === 'estimada'), p => p.valor), late: 0, ok: 0 });
  const max = Math.max(1, ...cols.map(c => c.fix + c.est + c.late + c.ok));
  const recebidoAgora = recebidoMes(startKey);
  const nRecebidoAgora = pagas.filter(p => monthKey(p.data_pagamento || p.vencimento) === startKey).length;
  const totalPend = sum(pend, p => p.valor);
  const temEst = pend.some(p => p.tipo === 'estimada');
  const nContr = new Set(pend.map(p => p.contrato_id).filter(Boolean)).size;
  const nAvulsos = pend.filter(p => !p.contrato_id).length;

  const ribbon = cols.map(c => {
    const tot = c.fix + c.est + c.late + c.ok;
    const h = v => (v / max * 100).toFixed(1) + '%';
    const titulo = (c.key.length === 7 ? monthLabel(c.key) : c.key === 'late' ? 'Atrasado' : 'Depois') + ': ' + [c.ok ? 'recebido ' + brl(c.ok) : '', c.fix + c.est + c.late ? 'a receber ' + brl(c.fix + c.est + c.late) : ''].filter(Boolean).join(', ');
    return `<button type="button" class="month${c.now ? ' now' : ''}${c.past ? ' past' : ''}" data-action="rec-month" data-key="${c.key}" data-modo="${c.past ? 'pagas' : c.now ? 'todas' : 'pendentes'}" title="${esc(titulo)}">
      <span class="amt${tot ? '' : ' zero'}">${tot ? brlShort(tot) : '—'}</span>
      <span class="bars">
        ${c.est ? `<span class="bar-est" style="height:${h(c.est)}"></span>` : ''}
        ${c.fix ? `<span class="bar-fix" style="height:${h(c.fix)}"></span>` : ''}
        ${c.late ? `<span class="bar-late" style="height:${h(c.late)}"></span>` : ''}
        ${c.ok ? `<span class="bar-ok" style="height:${h(c.ok)}"></span>` : ''}
      </span>
      <span class="lbl">${c.label}</span>
    </button>`;
  }).join('');

  const hero = `<section class="hero" aria-labelledby="h-receber">
    <div class="hero-top">
      <div class="hero-figs">
       <div>
        <h2 class="muted" style="font-family:var(--font-body);font-size:.95rem;font-weight:500">Recebido em ${MESES[+startKey.slice(5) - 1]}</h2>
        <div class="hero-total num hero-ok">${brl(recebidoAgora)}</div>
        <p class="hero-sub">${nRecebidoAgora ? plural(nRecebidoAgora, 'pagamento', 'pagamentos') + ' neste mês' : 'Nenhum pagamento neste mês ainda'}</p>
       </div>
       <div>
        <h2 id="h-receber" class="muted" style="font-family:var(--font-body);font-size:.95rem;font-weight:500">Total a receber</h2>
        <div class="hero-total num">${brl(totalPend)}</div>
        <p class="hero-sub">${totalPend
          ? `De ${nContr ? plural(nContr, 'processo', 'processos') : ''}${nContr && nAvulsos ? ' e ' : ''}${nAvulsos ? plural(nAvulsos, 'recebimento avulso', 'recebimentos avulsos') : ''}. Toque em um mês para ver quem paga.${temEst ? ' A parte listrada depende de um evento, como o nascimento do bebê, e a data é uma previsão.' : ''}`
          : 'Quando você cadastrar um processo, as parcelas aparecem aqui, mês a mês.'}</p>
       </div>
      </div>
      <div class="legend">
        <span><i class="lg-ok"></i>Recebido</span>
        <span><i class="lg-fix"></i>Data combinada</span>
        <span><i class="lg-est"></i>Data prevista</span>
        ${late ? '<span><i class="lg-late"></i>Atrasado</span>' : ''}
      </div>
    </div>
    ${totalPend || pagas.length ? `<div class="ribbon">${ribbon}</div>` : `<div class="empty" style="padding:28px 0 8px"><button class="btn btn-primary" type="button" data-action="new" data-what="contrato">${ic('plus')}Cadastrar processo</button></div>`}
  </section>`;

  // ---- indicadores do período
  const gastos = T('gastos').filter(g => inRange(g.data, r));
  const contr = T('contratos').filter(c => contratoValido(c) && inRange(c.data_fechamento, r));
  const investido = sum(gastos, g => g.valor);
  const contratado = sum(contr, c => c.valor_total);
  const recebido = sum(T('parcelas').filter(p => p.status === 'paga' && inRange(p.data_pagamento, r)), p => p.valor);
  const custo = contr.length ? investido / contr.length : 0;
  const kpis = `<div class="row spread wrap" style="margin:34px 0 12px">
      <h2>No período</h2>
      <div class="period" role="group" aria-label="Período">${PERIODOS.map(([v, l]) => `<button type="button" class="chip" data-action="periodo" data-v="${v}" aria-pressed="${S.periodo === v}">${l}</button>`).join('')}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><p>Investido</p><strong>${brl(investido)}</strong><span>${plural(gastos.length, 'gasto', 'gastos')}</span></div>
      <div class="kpi"><p>Processos fechados</p><strong>${contr.length}</strong><span>${contr.length ? 'ticket médio ' + brl(contratado / contr.length) : 'nenhum no período'}</span></div>
      <div class="kpi"><p>Valor contratado</p><strong>${brl(contratado)}</strong><span>soma dos contratos</span></div>
      <div class="kpi"><p>Recebido</p><strong>${brl(recebido)}</strong><span>parcelas e avulsos pagos</span></div>
      <div class="kpi"><p>Custo por processo</p><strong>${contr.length ? brl(custo) : '—'}</strong><span>investido ÷ processos</span></div>
    </div>`;

  // ---- para onde foi o dinheiro (árvore)
  const arvore = tabelaArvore(gastos, S.gasto.agrupar, contr, true);
  const catPanel = `<section class="panel">
    <div class="panel-head"><h3>Para onde foi o dinheiro</h3><button class="btn-text btn" type="button" data-action="go" data-route="gastos">Ver gastos</button></div>
    ${arvore ? `<div style="margin-bottom:14px">${segAgrupar()}</div>${arvore}`
      : `<div class="empty" style="padding:24px 0"><p>Nenhum gasto neste período.</p><button class="btn btn-ghost btn-sm" type="button" data-action="new" data-what="gasto">${ic('plus')}Lançar gasto</button></div>`}
  </section>`;

  // ---- próximos recebimentos
  const prox = pend.filter(p => p.vencimento).sort((a, b) => a.vencimento.localeCompare(b.vencimento)).slice(0, 6);
  const proxPanel = `<section class="panel">
    <div class="panel-head"><h3>Próximos recebimentos</h3><button class="btn-text btn" type="button" data-action="go" data-route="recebiveis">Ver todos</button></div>
    ${prox.length ? `<div class="list">${prox.map(p => linhaParcela(p, true)).join('')}</div>` : '<p class="muted small">Nada pendente.</p>'}
  </section>`;

  // ---- campanhas
  const camps = T('campanhas').map(statsCampanha).filter(s => s.gasto || s.contratos).sort((a, b) => b.gasto - a.gasto);
  const campPanel = `<section class="panel">
    <div class="panel-head"><h3>Retorno das campanhas</h3><button class="btn-text btn" type="button" data-action="go" data-route="campanhas">Ver campanhas</button></div>
    ${camps.length ? `<table class="table resp"><thead><tr><th>Campanha</th><th class="r">Investido</th><th class="r">Processos</th><th class="r">Contratado</th><th class="r">Retorno</th></tr></thead><tbody>
      ${camps.map(s => `<tr class="click" data-action="edit" data-what="campanha" data-id="${s.c.id}"><td data-l="Campanha"><b>${esc(s.c.nome)}</b><br><span class="small muted">${isPaga(s.c) ? esc(s.c.plataforma || '') : 'sem anúncio'}</span></td><td class="r num" data-l="Investido">${brl(s.gasto)}</td><td class="r num" data-l="Processos">${s.contratos}</td><td class="r num" data-l="Contratado">${brl(s.valor)}</td><td class="r num" data-l="Retorno">${s.gasto ? (s.valor / s.gasto).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '×' : '—'}</td></tr>`).join('')}
      </tbody></table>` : '<p class="muted small">Ao lançar gastos e processos, escolha a campanha ou origem para ver quanto cada uma traz de volta.</p>'}
  </section>`;

  // ---- produtos
  const porProd = {};
  contr.forEach(c => { const k = c.produto_id; porProd[k] = porProd[k] || { n: 0, v: 0 }; porProd[k].n++; porProd[k].v += c.valor_total || 0; });
  const prods = Object.entries(porProd).sort((a, b) => b[1].v - a[1].v);
  const pmax = prods.length ? prods[0][1].v || 1 : 1;
  const prodPanel = `<section class="panel">
    <div class="panel-head"><h3>Processos por serviço</h3><p>no período</p></div>
    ${prods.length ? `<div class="hbars">${prods.map(([id, s]) => `<div class="hbar"><span>${esc(produtoNome(id))} <span class="muted small">(${s.n})</span></span><b class="num">${brl(s.v)}</b><div class="track"><div class="fill" style="width:${(s.v / pmax * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>` : '<p class="muted small">Nenhum processo fechado no período.</p>'}
  </section>`;

  const alert = atrasadas.length ? `<div class="alert" style="margin-bottom:20px"><div class="grow"><b>${plural(atrasadas.length, 'parcela atrasada', 'parcelas atrasadas')}</b>, somando ${brl(late)}.</div><button class="btn btn-sm" type="button" data-action="rec-month" data-key="late">Ver quais</button></div>` : '';

  // ---- agenda
  const przPend = T('prazos').filter(z => z.status !== 'feito');
  const przAtras = przPend.filter(z => z.data < t).sort(ordPrazo);
  const przSemana = przPend.filter(z => z.data >= t && z.data <= addDays(t, 7)).sort(ordPrazo);
  const agendaPanel = `<section class="panel">
    <div class="panel-head"><h3>Agenda da semana</h3><button class="btn-text btn" type="button" data-action="go" data-route="agenda">Ver agenda</button></div>
    ${przAtras.length || przSemana.length ? `<div class="list">${przAtras.concat(przSemana).slice(0, 7).map(z => linhaPrazo(z)).join('')}</div>`
      : `<div class="empty" style="padding:24px 0"><p>Nada marcado para os próximos 7 dias.</p><button class="btn btn-ghost btn-sm" type="button" data-action="new" data-what="prazo">${ic('plus')}Adicionar prazo</button></div>`}
  </section>`;
  const alertPrazos = przAtras.length ? `<div class="alert" style="margin-bottom:20px"><div class="grow"><b>${plural(przAtras.length, 'prazo atrasado', 'prazos atrasados')}</b> na agenda.</div><button class="btn btn-sm" type="button" data-action="go" data-route="agenda">Ver agenda</button></div>` : '';

  return `${alertPrazos}${alert}${hero}${kpis}
    <div class="grid g2" style="margin-top:20px">${agendaPanel}${proxPanel}</div>
    <div class="grid g2" style="margin-top:20px">${catPanel}${prodPanel}</div>
    <div style="margin-top:20px">${campPanel}</div>`;
}

function statsCampanha(c) {
  const gasto = sum(T('gastos').filter(g => g.campanha_id === c.id), g => g.valor);
  const contr = T('contratos').filter(k => contratoValido(k) && (k.campanha_id === c.id));
  const clientes = T('clientes').filter(k => k.campanha_id === c.id).length;
  return { c, gasto, clientes, contratos: contr.length, valor: sum(contr, k => k.valor_total) };
}

function linhaParcela(p, compact) {
  const avulsa = !p.contrato_id;
  const c = avulsa ? {} : (byId('contratos', p.contrato_id) || {});
  const total = avulsa ? 1 : parcelasDe(p.contrato_id).length;
  const paga = p.status === 'paga';
  const nome = avulsa ? (p.cliente_id ? clienteNome(p.cliente_id) : (p.pessoa || 'Recebimento avulso')) : clienteNome(c.cliente_id);
  const sub = avulsa
    ? [p.categoria || 'Avulso', p.descricao].filter(Boolean).join(', ')

  const open = avulsa ? `data-action="edit" data-what="receita" data-id="${p.id}"` : `data-action="open-processo" data-id="${p.contrato_id}"`;

    </div>
    <div class="v"><b>${brl(p.valor)}</b><div class="small ${statusParcela(p) === 'atrasada' ? 'late-date' : 'muted'}">${paga && p.data_pagamento ? 'em ' + fmtDate(p.data_pagamento) : ({ atrasada: 'venceu ', estimada: 'previsto ' }[statusParcela(p)] || '') + fmtDate(p.vencimento)}</div></div>
    ${compact ? '' : badgeParcela(p)}
    <button class="icon-btn" type="button" data-action="toggle-paga" data-id="${p.id}" aria-label="${paga ? 'Desmarcar recebimento' : 'Marcar como recebida'}" title="${paga ? 'Desmarcar recebimento' : 'Marcar como recebida'}" style="${paga ? 'background:var(--ok-soft);color:var(--ok);border-color:transparent' : ''}">${ic('check')}</button>

}

/* =========================================================================
   AGENDA E PRAZOS
   ========================================================================= */
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dayLabel = iso => { const [y, m, d] = iso.split('-').map(Number); const w = DIAS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `${w[0].toUpperCase()}${w.slice(1)}, ${d} de ${MESES[m - 1]}`; };
function statusPrazo(z) {
  if (z.status === 'feito') return 'feito';
  if (z.data < today()) return 'atrasado';
  if (z.data === today()) return 'hoje';
  return 'pendente';
}
const ordPrazo = (a, b) => ((a.status === 'feito') - (b.status === 'feito')) || (a.data || '').localeCompare(b.data || '') || (a.hora || '99').localeCompare(b.hora || '99');
function prazoCtx(z) {
  const k = z.contrato_id ? byId('contratos', z.contrato_id) : null;
  return [z.cliente_id ? clienteNome(z.cliente_id) : '', k ? produtoNome(k.produto_id) : ''].filter(Boolean).join(', ') || 'Avulso';
}
function linhaPrazo(z, o = {}) {
  const st = statusPrazo(z), feito = st === 'feito';
  return `<div class="item static prazo-item ${st}">
    <button class="check${feito ? ' on' : ''}" type="button" data-action="toggle-prazo" data-id="${z.id}" aria-label="${feito ? 'Marcar como pendente' : 'Marcar como feito'}" title="${feito ? 'Marcar como pendente' : 'Marcar como feito'}">${feito ? ic('check') : ''}</button>
    <div class="grow" data-action="edit" data-what="prazo" data-id="${z.id}" style="cursor:pointer">
      <div class="t">${esc(z.titulo)}</div>
      <div class="s">${esc([z.tipo, o.semCtx ? '' : prazoCtx(z)].filter(Boolean).join(', '))}</div>
    </div>
    <div class="v small">${o.semData ? '' : `<div class="${st === 'atrasado' ? 'late-date' : ''}">${st === 'hoje' ? 'Hoje' : fmtDate(z.data)}</div>`}${z.hora ? `<div class="muted">${esc(z.hora)}</div>` : ''}</div>
    ${st === 'atrasado' ? '<span class="badge b-late">Atrasado</span>' : st === 'hoje' && !o.semData ? '<span class="badge b-est">Hoje</span>' : ''}
  </div>`;
}
function painelPrazos(list, opts) {
  const pend = list.filter(z => z.status !== 'feito').sort(ordPrazo);
  const feitos = list.filter(z => z.status === 'feito').sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 3);
  return `<section class="panel">
    <div class="panel-head"><h3>${opts.title}</h3><button class="btn btn-ghost btn-sm" type="button" data-action="new" data-what="prazo" data-cliente="${opts.cliente || ''}" data-processo="${opts.processo || ''}">${ic('plus')}Adicionar</button></div>
    ${pend.length || feitos.length ? `<div class="list">${pend.concat(feitos).map(z => linhaPrazo(z, { semCtx: opts.semCtx })).join('')}</div>` : `<p class="muted small">${opts.vazio}</p>`}
  </section>`;
}

function vAgenda() {
  const t = today();
  if (!S.agenda.mes) S.agenda.mes = t.slice(0, 7);
  if (!S.agenda.dia) S.agenda.dia = t;
  const mes = S.agenda.mes, dia = S.agenda.dia;
  const [y, m] = mes.split('-').map(Number);
  const startDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  let cells = Array.from({ length: 42 }, (_, i) => addDays(`${mes}-01`, i - startDow));
  if (cells.slice(35).every(d => d.slice(0, 7) !== mes)) cells = cells.slice(0, 35);
  const byDay = {};
  T('prazos').forEach(z => { (byDay[z.data] = byDay[z.data] || []).push(z); });
  Object.values(byDay).forEach(l => l.sort(ordPrazo));
  const venc = {};
  pendentes().forEach(p => { if (p.vencimento) venc[p.vencimento] = (venc[p.vencimento] || 0) + (p.valor || 0); });

  const cal = `<section class="panel cal-panel">
    <div class="cal-head">
      <button class="icon-btn" type="button" data-action="cal-mes" data-n="-1" aria-label="Mês anterior">${ic('left')}</button>
      <h2>${esc(monthLabel(mes))}</h2>
      <button class="icon-btn" type="button" data-action="cal-mes" data-n="1" aria-label="Próximo mês">${ic('right')}</button>
      <button class="btn btn-ghost btn-sm" type="button" data-action="cal-hoje">Hoje</button>
      <span class="grow"></span>
      <button class="btn btn-primary btn-sm" type="button" data-action="new" data-what="prazo" data-data="${dia}">${ic('plus')}Novo prazo</button>
    </div>
    <div class="cal" role="grid" aria-label="${esc(monthLabel(mes))}">
      ${DIAS.map(d => `<div class="cal-dow" role="columnheader">${d.slice(0, 3)}</div>`).join('')}
      ${cells.map(d => {
        const items = byDay[d] || [];
        const cls = ['cal-day', d.slice(0, 7) !== mes ? 'out' : '', d === t ? 'today' : '', d === dia ? 'sel' : ''].filter(Boolean).join(' ');
        return `<button type="button" class="${cls}" data-action="cal-dia" data-d="${d}" aria-label="${esc(dayLabel(d))}${items.length ? ', ' + plural(items.length, 'item', 'itens') : ''}">
          <span class="n">${+d.slice(8)}</span>${venc[d] ? `<span class="cal-money" title="A receber: ${brl(venc[d])}">${ic('coin')}</span>` : ''}
          ${items.slice(0, 3).map(z => `<span class="cal-item ${statusPrazo(z)}">${z.hora ? esc(z.hora) + ' ' : ''}${esc(z.titulo)}</span>`).join('')}
          ${items.length > 3 ? `<span class="cal-more">+${items.length - 3}</span>` : ''}
        </button>`;
      }).join('')}
    </div>
  </section>`;

  const doDia = (byDay[dia] || []);
  const recDia = pendentes().filter(p => p.vencimento === dia);
  const pend = T('prazos').filter(z => z.status !== 'feito');
  const atras = pend.filter(z => z.data < t).sort(ordPrazo);
  const prox = pend.filter(z => z.data > t && z.data <= addDays(t, 14)).sort(ordPrazo);
  const side = `<div class="stack">
    <section class="panel">
      <div class="panel-head"><h3>${esc(dayLabel(dia))}</h3><button class="btn btn-ghost btn-sm" type="button" data-action="new" data-what="prazo" data-data="${dia}">${ic('plus')}Adicionar</button></div>
      ${doDia.length ? `<div class="list">${doDia.map(z => linhaPrazo(z, { semData: true })).join('')}</div>` : '<p class="muted small">Nada marcado para este dia.</p>'}
      ${recDia.length ? `<p class="small muted" style="margin-top:12px">${ic('coin').replace('<svg ', '<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px" ')}A receber neste dia: <b>${brl(sum(recDia, p => p.valor))}</b></p>` : ''}
    </section>
    ${atras.length ? `<section class="panel"><div class="panel-head"><h3>Atrasados</h3><p>${atras.length}</p></div><div class="list">${atras.map(z => linhaPrazo(z)).join('')}</div></section>` : ''}
    <section class="panel"><div class="panel-head"><h3>Próximos 14 dias</h3></div>
      ${prox.length ? `<div class="list">${prox.map(z => linhaPrazo(z)).join('')}</div>` : '<p class="muted small">Nada nos próximos 14 dias.</p>'}</section>
  </div>`;
  return `<div class="grid g-cal">${cal}${side}</div>`;
}

function formPrazo(id, pre = {}) {
  const z = id ? byId('prazos', id) : {
    data: pre.data || today(), tipo: (S.config.tipos_prazo || [])[0], status: 'pendente',
    cliente_id: pre.cliente || '', contrato_id: pre.processo || ''

  const cliOpts = [['', 'Avulso (sem cliente)']].concat(T('clientes').slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(c => [c.id, c.nome]));
  const procOpts = cid => [['', cid ? 'Nenhum processo específico' : 'Escolha um cliente primeiro']].concat(cid ? contratosDe(cid).map(k => [k.id, produtoNome(k.produto_id) + (k.numero_processo ? ' (' + k.numero_processo + ')' : '')]) : []);
  openDrawer(() => ({
    title: id ? 'Editar prazo' : 'Novo prazo ou tarefa',
    sub: id ? '' : 'Aparece na agenda e na página do processo.',
    body: `<form class="form" id="fm" autocomplete="off">
      ${field('titulo', 'O que precisa ser feito', 'text', z.titulo, { full: true, required: true, autofocus: true, placeholder: 'Ex.: Protocolar contestação' })}
      ${field('data', 'Data', 'date', z.data)}

      ${id ? `<div class="field full"><label>Situação</label>${seg('status', z.status === 'feito' ? 'feito' : 'pendente', [['pendente', 'Pendente'], ['feito', 'Feito']])}</div>` : ''}
      ${field('observacoes', 'Observações', 'textarea', z.observacoes, { full: true })}
    </form>`,
    foot: `${id ? `<button class="btn btn-danger" type="button" data-action="del" data-what="prazo" data-id="${id}">Excluir</button>` : ''}<span class="spacer"></span>
      <button class="btn btn-ghost" type="button" data-action="close">Cancelar</button>
      <button class="btn btn-primary" type="button" data-action="submit-prazo" data-id="${id || ''}">${id ? 'Salvar alterações' : 'Adicionar à agenda'}</button>`,
    mount: root => {
      const fm = $('#fm', root);
      fm.cliente_id.onchange = () => {
        fm.contrato_id.innerHTML = procOpts(fm.cliente_id.value).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
      };
    }
  }));
}
function submitPrazo(id) {
  const fm = $('#fm'), v = readForm(fm);
  if (!v.titulo) return invalid(fm.titulo, 'Descreva o que precisa ser feito.');
  if (!v.data) return invalid(fm.data, 'Informe a data.');
  const base = id ? byId('prazos', id) : { id: uid(), status: 'pendente' };
  const status = v.status || base.status || 'pendente';
  save('prazos', Object.assign({}, base, v, { status, concluido_em: status === 'feito' ? (base.concluido_em || today()) : '' }));
  toast(id ? 'Prazo atualizado.' : 'Adicionado à agenda.');
  closeDrawer();
  if (S.route === 'agenda') { S.agenda.dia = v.data; S.agenda.mes = v.data.slice(0, 7); rerender(); }
}
function togglePrazo(id) {
  const z = byId('prazos', id);
  if (!z) return;
  const feito = z.status === 'feito';
  save('prazos', Object.assign({}, z, { status: feito ? 'pendente' : 'feito', concluido_em: feito ? '' : today() }));
  toast(feito ? 'Marcado como pendente.' : 'Feito.');
}

const statusProcBadge = k => k.status === 'cancelado' ? '<span class="badge b-mute">Cancelado</span>' : k.status === 'concluido' ? '<span class="badge b-ok">Concluído</span>' : '<span class="badge b-plan">Em andamento</span>';

const EXT = (f) => {
  if (f.isFolder) return ['folder', ''];
  const m = f.mime || '';
  const ext = (f.name.split('.').length > 1 ? f.name.split('.').pop() : '').toLowerCase().slice(0, 4);
  if (m.indexOf('pdf') >= 0) return ['pdf', 'pdf'];
  if (m.indexOf('image/') === 0) return ['img', ext || 'img'];
  if (/document|word|text/.test(m)) return ['doc', ext || 'doc'];
  if (/sheet|excel|csv/.test(m)) return ['sheet', ext || 'xls'];
  return ['', ext || 'arq'];
};
const fkey = (kind, id) => kind + ':' + id;
function painelDocs(kind, id, folderId, title, help) {
  const st = S.files[fkey(kind, id)] || {};
  const nav = st.nav || [];
  const cur = nav.length ? nav[nav.length - 1] : null;
  const src = cur || st;
  const folderUrl = cur ? (cur.url || 'https://drive.google.com/drive/folders/' + cur.id) : st.folder ? st.folder.url : (folderId ? 'https://drive.google.com/drive/folders/' + folderId : '');
  let list;
  if (src.loading && !src.items) list = '<div class="progress"><i></i></div><p class="small muted" style="margin-top:8px">Lendo a pasta no Drive…</p>';
  else if (src.error) list = `<p class="small" style="color:var(--color-primary)">${esc(src.error)}</p>`;
  else if (src.items && !src.items.length) list = '<p class="small muted">A pasta está vazia. Envie documentos abaixo ou direto pelo Google Drive.</p>';
  else if (src.items) list = `<div class="files">${src.items.map(f => {
    const [cls, lab] = EXT(f);
    const proc = f.isFolder && kind === 'cliente' && !cur ? T('contratos').find(k => k.drive_folder_id === f.id) : null;
    const meta = f.isFolder ? (proc ? 'Pasta do processo' : 'Pasta, toque para abrir') : [fmtSize(f.size), 'alterado em ' + fmtDate(f.updated.slice(0, 10))].filter(Boolean).join(', ');
    const attrs = proc ? `href="#" data-action="open-processo" data-id="${proc.id}"`
      : f.isFolder ? `href="#" data-action="folder-open" data-kind="${kind}" data-id="${id}" data-folder="${esc(f.id)}" data-name="${esc(f.name)}"`
      : `href="${esc(f.url)}" target="_blank" rel="noopener"`;
    return `<a class="file" ${attrs}><span class="ext ${cls}">${f.isFolder ? ic('drive') : esc(lab)}</span><span class="grow"><span class="t" style="display:block">${esc(f.name)}</span><span class="s">${meta}</span></span></a>`;
  }).join('')}</div>`;
  else list = '';
  const trail = nav.length ? `<nav class="crumbs small" style="margin-bottom:8px" aria-label="Pastas">
      <button type="button" data-action="folder-up" data-kind="${kind}" data-id="${id}" data-i="0">${ic('left').replace('<svg ', '<svg style="width:12px;height:12px;vertical-align:-1px" ')} ${esc(kind === 'cliente' ? 'Pasta do cliente' : 'Pasta do processo')}</button>
      ${nav.map((n, i) => i < nav.length - 1 ? `<span aria-hidden="true">/</span><button type="button" data-action="folder-up" data-kind="${kind}" data-id="${id}" data-i="${i + 1}">${esc(n.name)}</button>` : `<span aria-hidden="true">/</span><span aria-current="page">${esc(n.name)}</span>`).join('')}
    </nav>` : '';
  return `<div class="panel-head" style="margin-bottom:6px"><h3>${title}</h3>
      <span class="row" style="gap:6px">
        <button class="icon-btn" type="button" data-action="files-refresh" data-kind="${kind}" data-id="${id}" aria-label="Atualizar lista do Drive" title="Atualizar">${ic('refresh')}</button>
        ${folderUrl ? `<a class="btn btn-ghost btn-sm" href="${esc(folderUrl)}" target="_blank" rel="noopener">${ic('drive')}Abrir no Drive</a>` : ''}
      </span></div>
    ${help && !nav.length ? `<p class="small muted" style="margin-bottom:12px">${help}</p>` : ''}
    ${trail}
    ${src.loading && src.items ? '<div class="progress" style="margin-bottom:8px"><i></i></div>' : ''}
    ${list}
    <label class="drop" style="margin-top:14px">
      <input type="file" multiple data-upload="${id}" data-kind="${kind}" data-folder="${cur ? esc(cur.id) : ''}">
      ${st.uploading ? `Enviando ${plural(st.uploading, 'arquivo', 'arquivos')}…<div class="progress"><i></i></div>` : `${ic('upload').replace('<svg ', '<svg style="width:20px;height:20px;vertical-align:-4px;margin-right:6px" ')}Enviar documentos para ${cur ? '"' + esc(cur.name) + '"' : 'esta pasta'}`}
    </label>
    <p class="small muted" style="margin-top:10px">O que for adicionado ou alterado direto no Drive aparece aqui ao atualizar. <button class="btn btn-text btn-sm" type="button" data-action="link-folder" data-kind="${kind}" data-id="${id}">${ic('link')}Usar uma pasta que já existe</button></p>`;
}
function loadFiles(kind, id, force) {
  const st = S.files[fkey(kind, id)] = S.files[fkey(kind, id)] || {};
  if (st.loading || st.waiting || ((st.items || st.error) && !force)) return;
  // Se ainda há gravação a caminho (ex.: processo recém-criado), espera ela terminar antes de ler a pasta.
  if (S.pending) { st.waiting = true; setTimeout(() => { st.waiting = false; loadFiles(kind, id, force); }, 700); return; }
  st.loading = true; st.error = '';
  if (force) rerender();
  call('api_listFiles', kind, id).then(r => {
    st.items = r.items; st.folder = r.folder;
    if (r.record) upsertLocal(r.record.table, r.record.data);
  }).catch(err => { st.error = 'Não consegui ler a pasta no Drive: ' + err.message; })
    .finally(() => { st.loading = false; rerender(); });
}
function loadFolder(node) {
  node.loading = true; node.error = ''; rerender();
  call('api_listFolder', node.id).then(r => { node.items = r.items; node.url = r.folder.url; })
    .catch(err => { node.error = 'Não consegui abrir a pasta: ' + err.message; })
    .finally(() => { node.loading = false; rerender(); });
}
function openFolder(kind, id, folderId, name) {
  const st = S.files[fkey(kind, id)] = S.files[fkey(kind, id)] || {};
  st.nav = (st.nav || []).concat([{ id: folderId, name }]);
  loadFolder(st.nav[st.nav.length - 1]);
}
function refreshDocs(kind, id) {
  const st = S.files[fkey(kind, id)] || {};
  if (st.nav && st.nav.length) loadFolder(st.nav[st.nav.length - 1]);
  else loadFiles(kind, id, true);
}
const MAX_UPLOAD = 25 * 1024 * 1024;
function uploadFiles(kind, id, fileList, folderId) {
  const st = S.files[fkey(kind, id)] = S.files[fkey(kind, id)] || {};
  const target = folderId ? (st.nav || []).find(n => n.id === folderId) : st;
  Array.from(fileList).forEach(file => {
    if (file.size > MAX_UPLOAD) { toast(`"${file.name}" tem mais de 25 MB. Envie esse pelo Google Drive, direto na pasta.`, true); return; }
    st.uploading = (st.uploading || 0) + 1; rerender();
    const reader = new FileReader();
    reader.onload = () => {
      const data = String(reader.result).split(',')[1];
      call('api_upload', kind, id, { name: file.name, mime: file.type || 'application/octet-stream', data }, folderId || null)
        .then(item => { if (target) target.items = [item].concat((target.items || []).filter(f => f.id !== item.id)); toast('Enviado para o Drive: ' + file.name); })
        .catch(err => toast('Falha ao enviar ' + file.name + ': ' + err.message, true))
        .finally(() => { st.uploading--; rerender(); });
    };
    reader.onerror = () => { st.uploading--; toast('Não consegui ler ' + file.name, true); rerender(); };
    reader.readAsDataURL(file);
  });
}
function linkFolder(kind, id) {
  if ($('#lf')) { $('#lf').focus(); return; }
  const box = document.createElement('div');
  box.className = 'box'; box.style.marginTop = '10px';
  box.innerHTML = `<div class="field"><label for="lf">Link da pasta no Google Drive</label><input id="lf" placeholder="https://drive.google.com/drive/folders/…"></div>
    <div class="row" style="margin-top:10px"><button class="btn btn-primary btn-sm" type="button" id="lf-ok">Vincular pasta</button><button class="btn btn-text btn-sm" type="button" id="lf-no">Cancelar</button></div>`;
  const anchor = $(`[data-action="link-folder"][data-kind="${kind}"][data-id="${id}"]`).closest('p');
  anchor.after(box); $('#lf').focus();
  $('#lf-no').onclick = () => box.remove();
  $('#lf-ok').onclick = () => {
    const v = $('#lf').value.trim();
    if (!v) return;
    $('#lf-ok').disabled = true;
    call('api_linkFolder', kind, id, v).then(r => {
      upsertLocal(r.table, r.data); S.files[fkey(kind, id)] = {}; loadFiles(kind, id, true); toast('Pasta vinculada.');
    }).catch(err => { toast(err.message, true); $('#lf-ok').disabled = false; });
  };
}

        $('#novo-prod').hidden = fm.produto_id.value !== '__novo';
        if (fm.produto_id.value === '__novo') fm.np_nome.focus();
        const p = byId('produtos', fm.produto_id.value);
        if (p && p.valor_referencia && !parseMoney(fm.valor_total.value)) fm.valor_total.value = moneyIn(p.valor_referencia);
      };
      showForma();
      paintParcelas();
    }
  }));
}
function showForma() {
  document.querySelectorAll('#gerador [data-forma]').forEach(el => { el.hidden = el.dataset.forma !== S.form.forma; });
  const pagas = S.form.parcelas.filter(p => p.status === 'paga');
  $('#gerar-hint').textContent = pagas.length ? `As ${plural(pagas.length, 'parcela já recebida é mantida', 'parcelas já recebidas são mantidas')}.` : '';
}
function gerarParcelas() {
  const fm = $('#fm');
  const total = parseMoney(fm.valor_total.value);
  if (!total) return invalid(fm.valor_total, 'Informe o valor total antes de gerar as parcelas.');
  const pagas = S.form.parcelas.filter(p => p.status === 'paga');
  let resto = Math.round((total - sum(pagas, p => p.valor)) * 100) / 100;
  if (resto <= 0) { toast('O contrato já está todo recebido.'); return; }
  const novas = [];
  const mk = (valor, venc, tipo, cond) => ({ id: uid(), contrato_id: S.form.id, numero: 0, valor, vencimento: venc, tipo, condicao: cond || '', status: 'pendente', data_pagamento: '' });
  const split = (valor, n) => {
    const base = Math.floor(valor / n * 100) / 100;
    const arr = Array(n).fill(base);
    arr[n - 1] = Math.round((valor - base * (n - 1)) * 100) / 100;
    return arr;
  };
  if (S.form.forma === 'avista') {
    novas.push(mk(resto, fm.g_av_data.value, 'fixa'));
  } else if (S.form.forma === 'parcelado') {
    const ent = parseMoney(fm.g_entrada.value) || 0;
    const n = Math.max(1, parseInt(fm.g_n.value, 10) || 1);
    if (ent > 0 && !pagas.length) { novas.push(mk(Math.min(ent, resto), fm.g_entrada_data.value, 'fixa', 'Entrada')); resto = Math.round((resto - Math.min(ent, resto)) * 100) / 100; }
    if (resto > 0) split(resto, n).forEach((v, i) => novas.push(mk(v, addMonths(fm.g_d1.value || addMonths(today(), 1), i), 'fixa')));
  } else {
    const n = Math.max(1, parseInt(fm.g_ev_n.value, 10) || 1);
    const cond = fm.g_ev_cond.value.trim();
    const d = fm.g_ev_data.value;
    split(resto, n).forEach((v, i) => novas.push(mk(v, d ? addMonths(d, i) : '', 'estimada', i === 0 ? cond : (cond ? cond + ` (+${i} ${i === 1 ? 'mês' : 'meses'})` : ''))));
  }
  S.form.parcelas = pagas.concat(novas);
  renumber();
  paintParcelas();
}
function renumber() {
  S.form.parcelas.sort((a, b) => (a.status === 'paga') === (b.status === 'paga') ? (a.vencimento || '9').localeCompare(b.vencimento || '9') : (a.status === 'paga' ? -1 : 1));
  S.form.parcelas.forEach((p, i) => { p.numero = i + 1; });
}
function paintParcelas() {
  const box = $('#parc-box');
  if (!box) return;
  const ps = S.form.parcelas;
  const total = parseMoney($('#fm').valor_total.value) || 0;
  const soma = Math.round(sum(ps, p => p.valor) * 100) / 100;
  const diff = Math.round((total - soma) * 100) / 100;
  if (!ps.length) { box.innerHTML = '<p class="small muted">Nenhuma parcela ainda. Escolha a forma de pagamento e toque em gerar parcelas.</p>'; return; }
  box.innerHTML = `<label>Parcelas <span class="hint">(dá para ajustar valor, data e observação)</span></label>
    <table class="parc-table"><thead><tr><th style="width:34px">Nº</th><th>Vencimento</th><th style="width:30%">Valor</th><th>Observação</th><th style="width:34px"></th></tr></thead><tbody>
    ${ps.map((p, i) => `<tr>
      <td class="num">${p.numero}</td>
      <td><input type="date" value="${esc(p.vencimento)}" data-pi="${i}" data-pf="vencimento" ${p.status === 'paga' ? 'disabled' : ''}></td>
      <td><input inputmode="decimal" value="${esc(moneyIn(p.valor))}" data-pi="${i}" data-pf="valor" placeholder="Valor" ${p.status === 'paga' ? 'disabled' : ''}></td>
      <td>${p.status === 'paga' ? '<span class="badge b-ok">Recebida</span>' : `<input value="${esc(p.condicao)}" data-pi="${i}" data-pf="condicao" placeholder="${p.tipo === 'estimada' ? 'Paga quando' : 'Observação'}">`}</td>
      <td>${p.status === 'paga' ? '' : `<button class="icon-btn" type="button" style="width:30px;height:30px" data-action="parc-del" data-i="${i}" aria-label="Remover parcela">${ic('x')}</button>`}</td>
    </tr>`).join('')}</tbody></table>
    <div class="row spread"><button class="btn btn-text btn-sm" type="button" data-action="parc-add">${ic('plus')}Adicionar parcela</button>
    <p class="diff ${Math.abs(diff) > 0.009 ? 'bad' : 'muted'}">Soma das parcelas: ${brl(soma)}${Math.abs(diff) > 0.009 ? `, ${diff > 0 ? 'faltam' : 'sobram'} ${brl(Math.abs(diff))} em relação ao total` : ''}</p></div>`;
}
function submitContrato(id) {
  const fm = $('#fm'), v = readForm(fm);
  // Cliente
  let clienteId = v.cliente_id;
  const waits = [];
  if (clienteId === '__novo') {
    if (!v.nc_nome) return invalid(fm.nc_nome, 'Informe o nome do cliente novo.');
    const novo = { id: uid(), nome: v.nc_nome, whatsapp: v.nc_whatsapp, origem: v.nc_origem, campanha_id: v.campanha_id, status: 'ativo', drive_folder_id: '' };
    waits.push(save('clientes', novo));
    clienteId = novo.id;
  }
  if (!clienteId) return invalid(fm.cliente_id, 'Escolha o cliente.');
  // Produto
  let produtoId = v.produto_id;
  if (produtoId === '__novo') {
    if (!v.np_nome) return invalid(fm.np_nome, 'Informe o nome do serviço.');
    const np = { id: uid(), nome: v.np_nome, area: v.np_area, valor_referencia: null, ativo: true };
    waits.push(save('produtos', np));
    produtoId = np.id;
  }
  if (!produtoId) return invalid(fm.produto_id, 'Escolha o serviço.');
  if (!v.valor_total) return invalid(fm.valor_total, 'Informe o valor total.');
  if (!S.form.parcelas.length) gerarParcelas();
  if (!S.form.parcelas.length) return false;
  if (S.form.parcelas.some(p => !p.valor)) return invalid(null, 'Há parcela sem valor. Corrija ou remova.');

  const base = id ? byId('contratos', id) : {};
  const c = Object.assign({}, base, {
    id: S.form.id, cliente_id: clienteId, produto_id: produtoId, data_fechamento: v.data_fechamento,
    valor_total: v.valor_total, forma_pagamento: v.forma_pagamento, status: v.status || base.status || 'ativo',
    campanha_id: v.campanha_id, observacoes: v.observacoes,
    numero_processo: v.numero_processo, orgao: v.orgao, andamento: v.andamento, drive_folder_id: base.drive_folder_id || ''
  });
  const cli = byId('clientes', clienteId);
  if (cli && cli.status === 'lead') save('clientes', Object.assign({}, cli, { status: 'ativo' }));
  const parcelas = S.form.parcelas.map(p => Object.assign({}, p, { contrato_id: c.id }));
  saveContrato(c, parcelas, Promise.all(waits));
  toast(id ? 'Processo atualizado.' : 'Processo salvo. As parcelas já estão nos recebíveis.');
  closeDrawer();
  openProcesso(c.id);
}

function vRecebiveis() {
  const t = today();
  let ps = T('parcelas').filter(parcelaAtiva);
  const modo = S.rec.modo;
  if (modo === 'pendentes') ps = ps.filter(p => p.status !== 'paga');
  if (modo === 'pagas') ps = ps.filter(p => p.status === 'paga');
  const mes = S.rec.mes;
  if (mes === 'late') ps = ps.filter(p => p.status !== 'paga' && p.vencimento && p.vencimento < t);
  else if (mes === 'depois') { const lim = monthKey(addMonths(t.slice(0, 8) + '01', 11)); ps = ps.filter(p => !p.vencimento || monthKey(p.vencimento) > lim); }
  else if (mes) ps = ps.filter(p => monthKey(p.status === 'paga' ? (p.data_pagamento || p.vencimento) : p.vencimento) === mes);

  const dateOf = p => p.status === 'paga' ? (p.data_pagamento || p.vencimento) : p.vencimento;
  ps.sort((a, b) => modo === 'pagas' ? (dateOf(b) || '').localeCompare(dateOf(a) || '') : (dateOf(a) || '9').localeCompare(dateOf(b) || '9'));
  const groups = [];
  ps.forEach(p => {
    const k = monthKey(dateOf(p));
    let g = groups.find(x => x.k === k);
    if (!g) { g = { k, items: [] }; groups.push(g); }
    g.items.push(p);
  });
  const filtroMes = mes ? `<button class="chip" type="button" aria-pressed="true" data-action="rec-month" data-key="">${mes === 'late' ? 'Só atrasadas' : mes === 'depois' ? 'Depois de 12 meses' : esc(monthLabel(mes))} ${ic('x').replace('<svg ', '<svg style="width:12px;height:12px;vertical-align:-1px" ')}</button>` : '';
  const empty = !T('parcelas').length
    ? `<div class="panel empty"><h3>Nada a receber ainda</h3><p>As parcelas aparecem aqui quando você cadastra um processo. Consultas e outros valores avulsos entram por "Recebimento avulso".</p><div class="row" style="justify-content:center"><button class="btn btn-primary" type="button" data-action="new" data-what="contrato">${ic('plus')}Cadastrar processo</button><button class="btn btn-ghost" type="button" data-action="new" data-what="receita">${ic('plus')}Recebimento avulso</button></div></div>`
    : '<div class="panel empty"><p>Nenhuma parcela com esse filtro.</p></div>';
  return `<div class="toolbar">
      <div class="period">${[['pendentes', 'A receber'], ['pagas', 'Recebidas'], ['todas', 'Todas']].map(([v, l]) => `<button type="button" class="chip" data-action="rec-modo" data-v="${v}" aria-pressed="${modo === v}">${l}</button>`).join('')}${filtroMes}</div>
      <span class="total-line">${plural(ps.length, 'lançamento', 'lançamentos')}, <b>${brl(sum(ps, p => p.valor))}</b></span>
      <button class="btn btn-ghost" type="button" data-action="new" data-what="receita">${ic('plus')}Recebimento avulso</button>
    </div>
    ${groups.length ? `<section class="panel">${groups.map(g => `<div class="month-group">
        <div class="month-head"><h3>${esc(monthLabel(g.k))}</h3><b class="num">${brl(sum(g.items, p => p.valor))}</b></div>
        <div class="list">${g.items.map(p => linhaParcela(p)).join('')}</div></div>`).join('')}</section>` : empty}`;
}

        <div class="kpi"><p>Contratado</p><strong>${brl(s.valor)}</strong></div>
        <div class="kpi"><p>Custo por processo</p><strong>${s.contratos ? brl(s.gasto / s.contratos) : '—'}</strong></div>
      </div></section>`;
  }).join('')}</div>`;
}
function formCampanha(id) {
  const c = id ? byId('campanhas', id) : { status: 'ativa', inicio: today(), plataforma: (S.config.plataformas || [])[0] };
  openDrawer(() => ({
    title: id ? 'Editar campanha' : 'Nova campanha',
    body: `<form class="form" id="fm" autocomplete="off">
      ${field('nome', 'Nome da campanha', 'text', c.nome, { full: true, required: true, autofocus: true, placeholder: 'Ex.: Divórcio consensual, novembro' })}
      ${field('plataforma', 'Plataforma', 'select', c.plataforma, { options: optList('plataformas') })}
      ${field('produto_id', 'Serviço anunciado', 'select', c.produto_id, { options: [['', 'Vários ou nenhum']].concat(T('produtos').map(p => [p.id, p.nome])) })}
      ${field('inicio', 'Início', 'date', c.inicio)}
      ${field('fim', 'Fim', 'date', c.fim)}
      ${field('orcamento', 'Orçamento previsto', 'money', c.orcamento)}
      <div class="field"><label>Situação</label>${seg('status', c.status || 'ativa', STATUS_CAMP)}</div>
      ${field('observacoes', 'Observações', 'textarea', c.observacoes, { full: true })}
    </form>`,
    foot: `${id ? `<button class="btn btn-danger" type="button" data-action="del" data-what="campanha" data-id="${id}">Excluir</button>` : ''}<span class="spacer"></span>
      <button class="btn btn-ghost" type="button" data-action="close">Cancelar</button>
      <button class="btn btn-primary" type="button" data-action="submit-campanha" data-id="${id || ''}">${id ? 'Salvar alterações' : 'Cadastrar campanha'}</button>`
  }));
}
function submitCampanha(id) {
  const fm = $('#fm'), v = readForm(fm);
  if (!v.nome) return invalid(fm.nome, 'Dê um nome à campanha.');
  save('campanhas', Object.assign({}, id ? byId('campanhas', id) : { id: uid() }, v));
  toast(id ? 'Campanha atualizada.' : 'Campanha cadastrada.');
  closeDrawer();
}

/* =========================================================================
   PRODUTOS E SERVIÇOS
   ========================================================================= */
function vProdutos() {
  const areas = [...new Set(T('produtos').map(p => p.area || 'Outro'))];
  const ordem = (S.config.areas || []).concat(areas.filter(a => (S.config.areas || []).indexOf(a) < 0));
  const blocks = ordem.filter(a => areas.indexOf(a) >= 0).map(a => {
    const ps = T('produtos').filter(p => (p.area || 'Outro') === a).sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR'));
    return `<div class="month-group"><div class="month-head"><h3>${esc(a)}</h3><span class="small muted">${plural(ps.length, 'serviço', 'serviços')}</span></div>
      <div class="list">${ps.map(p => {
        const ks = T('contratos').filter(k => k.produto_id === p.id && contratoValido(k));
        return `<div class="item" role="button" tabindex="0" data-action="edit" data-what="produto" data-id="${p.id}">
          <div class="grow"><div class="t">${esc(p.nome)} ${p.ativo === false ? '<span class="badge b-mute">Fora de oferta</span>' : ''}</div>
          <div class="s">${p.valor_referencia ? 'Valor de referência ' + brl(p.valor_referencia) : 'Sem valor de referência'}</div></div>
          <div class="v"><b>${plural(ks.length, 'processo', 'processos')}</b><div class="small muted">${brl(sum(ks, k => k.valor_total))}</div></div></div>`;
      }).join('')}</div></div>`;
  }).join('');
  return `<div class="toolbar"><p class="muted" style="flex:1">Os serviços que você oferece. Eles aparecem na hora de cadastrar um processo.</p>
    <button class="btn btn-ghost" type="button" data-action="new" data-what="produto">${ic('plus')}Novo serviço</button></div>
    <section class="panel">${blocks || '<p class="empty">Nenhum serviço cadastrado.</p>'}</section>`;
}
function formProduto(id) {
  const p = id ? byId('produtos', id) : { ativo: true, area: (S.config.areas || [])[0] };
  openDrawer(() => ({
    title: id ? 'Editar serviço' : 'Novo serviço',
    body: `<form class="form" id="fm" autocomplete="off">
      ${field('nome', 'Nome do serviço', 'text', p.nome, { full: true, required: true, autofocus: true, placeholder: 'Ex.: Inventário extrajudicial' })}
      ${field('area', 'Área', 'select', p.area, { options: optList('areas') })}
      ${field('valor_referencia', 'Valor de referência', 'money', p.valor_referencia, { hint: 'Preenche o contrato automaticamente.' })}
      <div class="field full"><label>Está oferecendo hoje?</label>${seg('ativo', p.ativo === false ? 'false' : 'true', [['true', 'Sim, em oferta'], ['false', 'Não, fora de oferta']])}</div>
    </form>`,
    foot: `${id ? `<button class="btn btn-danger" type="button" data-action="del" data-what="produto" data-id="${id}">Excluir</button>` : ''}<span class="spacer"></span>
      <button class="btn btn-ghost" type="button" data-action="close">Cancelar</button>
      <button class="btn btn-primary" type="button" data-action="submit-produto" data-id="${id || ''}">${id ? 'Salvar alterações' : 'Cadastrar serviço'}</button>`
  }));
}
function submitProduto(id) {
  const fm = $('#fm'), v = readForm(fm);
  if (!v.nome) return invalid(fm.nome, 'Informe o nome do serviço.');
  v.ativo = v.ativo !== 'false';
  save('produtos', Object.assign({}, id ? byId('produtos', id) : { id: uid() }, v));
  toast(id ? 'Serviço atualizado.' : 'Serviço cadastrado.');
  closeDrawer();
}

/* =========================================================================
   AJUSTES
   ========================================================================= */
const LISTAS = [
  ['categorias_gasto', 'Categorias de gasto', 'Usadas ao lançar um gasto.'],
  ['origens', 'Como os clientes chegam', 'Usadas no cadastro do cliente.'],
  ['areas', 'Áreas de atuação', 'Agrupam os produtos e serviços.'],
  ['plataformas', 'Plataformas de anúncio', 'Usadas nas campanhas.'],
  ['tipos_prazo', 'Tipos de prazo', 'Usados na agenda.'],
  ['categorias_receita', 'Tipos de recebimento avulso', 'Usados ao lançar consultas e outros recebimentos.']
];
/** Onde cada lista é usada: renomear um item atualiza esses registros. */
const LIST_USO = { areas: ['produtos', 'area'], categorias_gasto: ['gastos', 'categoria'], plataformas: ['campanhas', 'plataforma'], origens: ['clientes', 'origem'], tipos_prazo: ['prazos', 'tipo'], categorias_receita: ['parcelas', 'categoria'] };
const RENAME_HINT = {
  areas: 'Todos os serviços desta área passam a usar o nome novo.',
  categorias_gasto: 'Todos os gastos desta categoria passam a usar o nome novo.',
  plataformas: 'Todas as campanhas desta plataforma passam a usar o nome novo.',
  origens: 'Todos os clientes com esta origem passam a usar o nome novo.',
  tipos_prazo: 'Todos os prazos deste tipo passam a usar o nome novo.',
  categorias_receita: 'Todos os recebimentos deste tipo passam a usar o nome novo.'
};
function renameItem(k, i, novo) {
  const arr = (S.config[k] || []).slice();
  const antigo = arr[i];
  if (!novo || novo === antigo) { S.renaming = null; rerender(); return; }
  arr[i] = novo;
  S.renaming = null;
  saveConfig(k, arr);
  const [t, f] = LIST_USO[k];
  const afetados = T(t).filter(r => r[f] === antigo);
  afetados.forEach(r => save(t, Object.assign({}, r, { [f]: novo })));
  toast(`Renomeado para "${novo}"${afetados.length ? `, ${plural(afetados.length, 'registro atualizado', 'registros atualizados')}` : ''}.`);
}
function vAjustes() {
  return `<div class="grid g2">${LISTAS.map(([k, t, d]) => `<section class="panel">
      <div class="panel-head"><div><h3>${t}</h3><p>${d}</p></div></div>
      <div class="tags">${(S.config[k] || []).map((x, i) => `<span class="tag">${esc(x)}<button type="button" data-action="list-rename" data-k="${k}" data-i="${i}" aria-label="Renomear ${esc(x)}" title="Renomear">${ic('edit')}</button><button type="button" data-action="list-del" data-k="${k}" data-i="${i}" aria-label="Remover ${esc(x)}" title="Remover">${ic('x')}</button></span>`).join('')}</div>
      ${S.renaming && S.renaming.k === k
        ? `<form class="row" style="margin-top:14px" data-list-rename="${k}"><input class="search" style="min-width:0" value="${esc(S.config[k][S.renaming.i])}" aria-label="Novo nome"><button class="btn btn-primary btn-sm" type="submit">Renomear</button><button class="btn btn-text btn-sm" type="button" data-action="list-rename-cancel">Cancelar</button></form>
           <p class="small muted" style="margin-top:6px">${RENAME_HINT[k]}</p>`
        : `<form class="row" style="margin-top:14px" data-list-add="${k}"><input class="search" style="min-width:0" placeholder="Adicionar" aria-label="Adicionar em ${t}"><button class="btn btn-ghost btn-sm" type="submit">Adicionar</button></form>`}
    </section>`).join('')}
    <section class="panel">
      <div class="panel-head"><div><h3>Google Drive e dados</h3><p>Onde ficam as pastas dos clientes e a planilha com os dados do painel.</p></div></div>
      <div class="row wrap">
        ${S.meta.driveRootUrl ? `<a class="btn btn-ghost" href="${esc(S.meta.driveRootUrl)}" target="_blank" rel="noopener">${ic('drive')}Pasta dos clientes</a>` : ''}
        ${S.meta.planilhaUrl ? `<a class="btn btn-ghost" href="${esc(S.meta.planilhaUrl)}" target="_blank" rel="noopener">${ic('file')}Planilha de dados</a>` : ''}
      </div>
      <form class="field" style="margin-top:18px" data-root-form>
        <label for="root-url">Usar outra pasta-mãe para clientes novos</label>
        <div class="row"><input id="root-url" class="search" style="min-width:0" placeholder="Cole o link da pasta do Drive"><button class="btn btn-ghost btn-sm" type="submit">Trocar</button></div>
        <span class="hint">As pastas de clientes já cadastrados continuam onde estão.</span>
      </form>
    </section></div>`;
}

/* =========================================================================
   MENU "ADICIONAR" E "MAIS"
   ========================================================================= */
function menuNovo() {
  const op = [
    ['contrato', 'file', 'Processo', 'Contrato fechado: cliente, serviço, honorários e parcelas'],
    ['prazo', 'clock', 'Prazo ou tarefa', 'Entra na agenda; pode ser de um processo ou avulso'],
    ['receita', 'coin', 'Recebimento avulso', 'Consulta ou outro valor fora de um processo'],
    ['cliente', 'users', 'Cliente', 'Também cria a pasta no Drive'],
    ['gasto', 'wallet', 'Gasto', 'Mentoria, curso, software, anúncio'],
    ['campanha', 'mega', 'Campanha', 'Meta Ads ou Google Ads'],
    ['produto', 'tag', 'Serviço', 'Algo novo que você passou a oferecer']
  ];
  openDrawer(() => ({
    title: 'Adicionar',
    body: `<div class="list">${op.map(([w, i, t, s]) => `<button class="item" type="button" data-action="new" data-what="${w}">
      <span class="avatar">${ic(i).replace('<svg ', '<svg style="width:20px;height:20px" ')}</span>
      <span class="grow"><span class="t" style="display:block">${t}</span><span class="s">${s}</span></span></button>`).join('')}</div>`
  }));
}
function menuMais() {
  openDrawer(() => ({
    title: 'Mais',
    body: `<div class="list">${ROUTES.filter(r => TABS.indexOf(r.id) < 0).map(r => `<button class="item" type="button" data-action="go" data-route="${r.id}">
      <span class="avatar">${ic(r.icon).replace('<svg ', '<svg style="width:20px;height:20px" ')}</span><span class="grow"><span class="t" style="display:block">${r.label}</span></span></button>`).join('')}</div>`
  }));
}

/* =========================================================================
   EVENTOS
   ========================================================================= */
const NEW = {
  contrato: (el) => formContrato(null, el.dataset.cliente), cliente: () => formCliente(), gasto: () => formGasto(), campanha: () => formCampanha(), produto: () => formProduto(),
  prazo: el => formPrazo(null, { cliente: el.dataset.cliente, processo: el.dataset.processo, data: el.dataset.data }), receita: () => formReceita()
};
const EDIT = { contrato: id => formContrato(id), cliente: id => formCliente(id), gasto: id => formGasto(id), campanha: id => formCampanha(id), produto: id => formProduto(id), prazo: id => formPrazo(id), receita: id => formReceita(id) };
const TABLE = { contrato: 'contratos', cliente: 'clientes', gasto: 'gastos', campanha: 'campanhas', produto: 'produtos', prazo: 'prazos', receita: 'parcelas' };
const DEL_TXT = {
  cliente: id => `Excluir ${esc(clienteNome(id))}, ${plural(contratosDe(id).length, 'processo', 'processos')} e os prazos dele? As pastas no Drive são mantidas.`,
  contrato: () => 'Excluir este processo, as parcelas e os prazos dele? A pasta no Drive é mantida.',
  prazo: () => 'Excluir este item da agenda?',
  receita: () => 'Excluir este recebimento?',
  gasto: () => 'Excluir este gasto?',
  campanha: () => 'Excluir esta campanha? Gastos e processos ligados a ela ficam sem campanha.',
  produto: id => T('contratos').some(k => k.produto_id === id) ? 'Há processos com este serviço. Prefira marcar como fora de oferta. Excluir mesmo assim?' : 'Excluir este serviço?'
};

const ACTIONS = {
  'go': el => go(el.dataset.route),
  'more': () => menuMais(),
  'close': () => closeDrawer(),
  'new-menu': () => menuNovo(),
  'new': el => NEW[el.dataset.what](el),
  'edit': el => EDIT[el.dataset.what](el.dataset.id),
  'open-cliente': el => openCliente(el.dataset.id),
  'open-processo': el => openProcesso(el.dataset.id),
  'periodo': el => { S.periodo = el.dataset.v; rerender(); },
  'cli-status': el => { S.clienteStatus = el.dataset.v; rerender(); },
  'rec-modo': el => { S.rec.modo = el.dataset.v; rerender(); },
  'rec-month': el => { S.rec.mes = el.dataset.key; if (el.dataset.key) S.rec.modo = el.dataset.modo || 'pendentes'; go('recebiveis'); },
  'gasto-cat': el => { S.gasto.cat = el.dataset.v; rerender(); },
  'gasto-periodo': el => { S.gasto.periodo = el.dataset.v; rerender(); },
  'toggle-paga': el => togglePaga(el.dataset.id),
  'seg': el => {
    el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    if (el.dataset.name === 'forma_pagamento' && S.form) { S.form.forma = el.dataset.value; showForma(); }
  },
  'gerar': () => gerarParcelas(),
  'parc-add': () => {
    const last = S.form.parcelas[S.form.parcelas.length - 1];
    S.form.parcelas.push({ id: uid(), contrato_id: S.form.id, numero: 0, valor: null, vencimento: last && last.vencimento ? addMonths(last.vencimento, 1) : addMonths(today(), 1), tipo: S.form.forma === 'evento' ? 'estimada' : 'fixa', condicao: '', status: 'pendente', data_pagamento: '' });
    renumber(); paintParcelas();
  },
  'parc-del': el => { S.form.parcelas.splice(+el.dataset.i, 1); renumber(); paintParcelas(); },
  'submit-cliente': el => submitCliente(el.dataset.id),
  'submit-contrato': el => submitContrato(el.dataset.id),
  'submit-gasto': el => submitGasto(el.dataset.id),
  'submit-campanha': el => submitCampanha(el.dataset.id),
  'submit-produto': el => submitProduto(el.dataset.id),
  'del': el => {
    const w = el.dataset.what, id = el.dataset.id;
    askDelete(DEL_TXT[w](id), () => {
      const clienteDoContrato = w === 'contrato' ? (byId('contratos', id) || {}).cliente_id : '';
      remove(TABLE[w], id);
      toast('Excluído.');
      closeDrawer();
      if (clienteDoContrato) openCliente(clienteDoContrato);
      else if (w === 'cliente') go('clientes');
    });
  },
  'files-refresh': el => refreshDocs(el.dataset.kind, el.dataset.id),
  'folder-open': el => openFolder(el.dataset.kind, el.dataset.id, el.dataset.folder, el.dataset.name),
  'folder-up': el => { const st = S.files[fkey(el.dataset.kind, el.dataset.id)] || {}; st.nav = (st.nav || []).slice(0, +el.dataset.i); rerender(); },
  'toggle-prazo': el => togglePrazo(el.dataset.id),
  'cal-dia': el => { S.agenda.dia = el.dataset.d; if (el.dataset.d.slice(0, 7) !== S.agenda.mes) S.agenda.mes = el.dataset.d.slice(0, 7); rerender(); },
  'cal-mes': el => { S.agenda.mes = monthKey(addMonths(S.agenda.mes + '-01', +el.dataset.n)); rerender(); },
  'cal-hoje': () => { S.agenda.mes = today().slice(0, 7); S.agenda.dia = today(); rerender(); },
  'submit-prazo': el => submitPrazo(el.dataset.id),
  'submit-receita': el => submitReceita(el.dataset.id),
  'link-folder': el => linkFolder(el.dataset.kind, el.dataset.id),
  'agrupar': el => { S.gasto.agrupar = el.dataset.v; rerender(); },
  'list-rename': el => { S.renaming = { k: el.dataset.k, i: +el.dataset.i }; rerender(); const inp = $('[data-list-rename] input'); if (inp) { inp.focus(); inp.select(); } },
  'list-rename-cancel': () => { S.renaming = null; rerender(); },
  'list-del': el => {
    const k = el.dataset.k, arr = (S.config[k] || []).slice();
    arr.splice(+el.dataset.i, 1);
    saveConfig(k, arr);
  }
};
function saveConfig(k, arr) {
  S.config[k] = arr; rerender();
  track(call('api_saveConfig', k, arr));
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.drawer) closeDrawer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('#fm input') && !e.target.closest('.parc-table')) {
    const btn = $('#drawer [data-action^="submit-"]');
    if (btn) { e.preventDefault(); btn.click(); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'q') {
    S.q = t.value;
    const pos = t.selectionStart;
    rerender();
    const n = $('[data-input="q"]'); n.focus(); n.setSelectionRange(pos, pos);
  }
  if (t.dataset.pi !== undefined && S.form) {
    const p = S.form.parcelas[+t.dataset.pi];
    p[t.dataset.pf] = t.dataset.pf === 'valor' ? parseMoney(t.value) : t.value;
  }
  if (t.name === 'valor_total' && S.form) paintParcelas();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pi !== undefined && S.form) {
    if (t.dataset.pf === 'valor') t.value = moneyIn(parseMoney(t.value));
    if (t.dataset.pf === 'vencimento') renumber();
    paintParcelas();
  }
  if (t.hasAttribute('data-money') && t.value) t.value = moneyIn(parseMoney(t.value));
  if (t.dataset.upload) { uploadFiles(t.dataset.kind, t.dataset.upload, Array.from(t.files), t.dataset.folder); t.value = ''; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.listAdd) {
    e.preventDefault();
    const v = f.querySelector('input').value.trim();
    if (!v) return;
    const k = f.dataset.listAdd, arr = (S.config[k] || []).slice();
    if (arr.indexOf(v) < 0) arr.push(v);
    saveConfig(k, arr);
  }
  if (f.dataset.listRename) {
    e.preventDefault();
    renameItem(f.dataset.listRename, S.renaming.i, f.querySelector('input').value.trim());
  }
  if (f.hasAttribute('data-root-form')) {
    e.preventDefault();
    const v = $('#root-url').value.trim();
    if (!v) return;
    call('api_setDriveRoot', v).then(url => { S.meta.driveRootUrl = url; rerender(); toast('Pasta-mãe trocada.'); })
      .catch(err => toast(err.message, true));
  }
  if (f.id === 'fm') e.preventDefault();
});

// ------------------------------------------------------------------ início ---
document.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = LOGO; });
call('api_bootstrap').then(d => {
  S.tables = d.tables; S.config = d.config; S.meta = d.meta; S.ready = true;
  rerender();
}).catch(err => {
  $('#view').innerHTML = `<div class="panel empty"><h3>Não consegui abrir o painel</h3><p>${esc(err.message)}</p>
    <button class="btn btn-primary" type="button" onclick="location.reload()">Tentar de novo</button></div>`;
});
})();
</script>
