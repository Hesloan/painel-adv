<style>
/* Identidade visual oficial (mesmos tokens do site giovanna_site/css/styles.css) */
:root {
  --color-primary: #850C0D;
  --color-primary-dark: #6F0B23;
  --color-primary-soft: #FFC8CB;
  --color-background: #F9F2E7;
  --color-surface: #FFFFFF;
  --color-text: #2A1A1C;
  --color-text-soft: #6B5558;
  --color-border: #E8D9D5;
  --color-accent: #A94A58;
  --color-soft-light: #FFF3F3;
  --color-bg-dark: #2A1215;
  --color-text-on-dark: #F8EFEE;
  --color-text-on-dark-muted: #D9BFC2;

  /* Estados (derivados da paleta; o verde é o único tom fora dela, para "recebido") */
  --ok: #2F6B4F;
  --ok-soft: #E4F0E9;
  --warn: var(--color-primary);
  --warn-soft: var(--color-soft-light);

  --font-heading: "DM Serif Display", Georgia, serif;
  --font-body: "Inter", Arial, sans-serif;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-full: 999px;
  --shadow: 0 1px 2px rgba(42, 26, 28, .05), 0 6px 24px rgba(111, 11, 35, .06);
  --sidebar: 248px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html, body { overflow-x: clip; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  color: var(--color-text);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--color-primary); }
h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.muted { color: var(--color-text-soft); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Estrutura ---------- */
.shell { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  background: var(--color-primary-dark); color: var(--color-text-on-dark);
  display: flex; flex-direction: column; padding: 28px 18px 20px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 28px; }
[data-logo] { display: inline-flex; flex: none; }
[data-logo] svg { width: 100%; height: 100%; display: block; }
.brand [data-logo] { width: 40px; height: 28px; color: var(--color-primary-soft); }
.brand strong { font-family: var(--font-heading); font-weight: 400; font-size: 1.25rem; display: block; line-height: 1.1; }
.brand span { font-size: .8rem; color: var(--color-text-on-dark-muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: none; border: 0; border-radius: var(--r-sm); cursor: pointer;
  padding: 10px 12px; color: var(--color-text-on-dark-muted); text-align: left; font-size: .95rem;
}
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { color: var(--color-text-on-dark); background: rgba(255, 200, 203, .08); }
.nav button[aria-current="page"] { color: var(--color-primary-dark); background: var(--color-background); font-weight: 600; }
.nav-sep { height: 1px; background: rgba(255, 200, 203, .16); margin: 12px 10px; }
.sidebar-foot { margin-top: auto; padding: 0 10px; font-size: .78rem; color: var(--color-text-on-dark-muted); }

.main { margin-left: var(--sidebar); padding: 0 40px 64px; max-width: calc(1180px + var(--sidebar)); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 22px 0 18px; background: var(--color-background);
}
.topbar h1 { flex: 1; min-width: 0; }
.topbar .brand-mini { display: none; }
.sync { font-size: .8rem; color: var(--color-text-soft); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.sync.busy i { background: var(--color-accent); animation: pulse 1s infinite; }
.sync.err i { background: var(--color-primary); }
@keyframes pulse { 50% { opacity: .3; } }

.tabbar { display: none; }

/* ---------- Botões ---------- */
.btn {
  font-family: var(--font-body);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-full); border: 1px solid transparent; cursor: pointer;
  padding: 10px 18px; font-weight: 600; font-size: .9rem; text-decoration: none; white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-dark); }
.btn-ghost { background: var(--color-surface); border-color: var(--color-border); color: var(--color-primary-dark); }
.btn-ghost:hover { border-color: var(--color-primary); color: var(--color-primary); }
.btn-text { background: none; border: 0; color: var(--color-primary); padding: 6px 8px; }
.btn-danger { background: none; border-color: var(--color-border); color: var(--color-primary); }
.btn-sm { padding: 6px 12px; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--color-border);
  background: var(--color-surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-primary-dark);
  flex: none;
}
.icon-btn svg { width: 18px; height: 18px; }
.wa { background: #fff; color: #1F7A4D; border-color: #CFE6DA; }
.wa:hover { background: #F0F8F3; }

/* ---------- Superfícies ---------- */
.panel { background: var(--color-surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 22px 24px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.panel-head p { font-size: .85rem; color: var(--color-text-soft); }
.grid { display: grid; gap: 20px; align-items: start; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.g-wide { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.g-cal { grid-template-columns: minmax(0, 2.3fr) minmax(300px, 1fr); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 12px; }
.spread { justify-content: space-between; }
.wrap { flex-wrap: wrap; }

/* ---------- Hero: o que entra nos próximos meses ---------- */
.hero {
  background: var(--color-surface); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 28px 28px 22px; overflow: hidden; position: relative;
}
.hero-top { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.hero-total { font-family: var(--font-heading); font-size: 3.1rem; line-height: 1; color: var(--color-primary-dark); }
.hero-total small { font-family: var(--font-body); font-size: 1rem; color: var(--color-text-soft); margin-left: 4px; }
.hero-sub { margin-top: 8px; color: var(--color-text-soft); max-width: 46ch; }
.legend { display: flex; gap: 16px; font-size: .8rem; color: var(--color-text-soft); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.lg-fix { background: var(--color-primary); }
.lg-est { background: repeating-linear-gradient(135deg, var(--color-accent) 0 3px, var(--color-primary-soft) 3px 6px); }
.lg-late { background: var(--color-bg-dark); }

.ribbon { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 6px; margin-top: 26px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.month {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; min-width: 0;
}
.month .bars { height: 150px; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 10px; background: var(--color-background); overflow: hidden; position: relative; }
.month .bar-fix { background: var(--color-primary); }
.month .bar-est { background: repeating-linear-gradient(135deg, var(--color-accent) 0 4px, var(--color-primary-soft) 4px 8px); }
.month .bar-late { background: var(--color-bg-dark); }
.month .bar-ok { background: var(--ok); }
.month.past .lbl { color: var(--color-text-soft); }
.lg-ok { background: var(--ok); }
.hero-figs { display: flex; gap: 48px; flex-wrap: wrap; }
.hero-figs > div { min-width: 0; }
.hero-ok { color: var(--ok); }
.month .amt { font-size: .82rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.month .amt.zero { color: var(--color-border); font-weight: 400; }
.month .lbl { font-size: .78rem; color: var(--color-text-soft); text-transform: capitalize; }
.month .lbl b { color: var(--color-text); font-weight: 600; }
.month:hover .bars { outline: 2px solid var(--color-primary-soft); }
.month.now .lbl { color: var(--color-primary); font-weight: 600; }

/* ---------- Indicadores do período ---------- */
.period { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-soft);
  border-radius: var(--r-full); padding: 6px 14px; font-size: .85rem; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--color-primary-dark); border-color: var(--color-primary-dark); color: #fff; }
.chip:hover:not([aria-pressed="true"]) { border-color: var(--color-accent); color: var(--color-primary-dark); }

.kpis { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--color-surface); border-radius: var(--r-md); box-shadow: var(--shadow); }
.kpi { padding: 18px 20px; border-left: 1px solid var(--color-border); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi p { font-size: .82rem; color: var(--color-text-soft); }
.kpi strong { display: block; font-size: 1.4rem; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.kpi span { font-size: .78rem; color: var(--color-text-soft); }

/* ---------- Barras horizontais ---------- */
.hbars { display: flex; flex-direction: column; gap: 12px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .9rem; }
.hbar .track { grid-column: 1 / -1; height: 8px; background: var(--color-background); border-radius: var(--r-full); overflow: hidden; }
.hbar .fill { height: 100%; background: var(--color-accent); border-radius: var(--r-full); }
.hbar:first-child .fill { background: var(--color-primary); }

/* ---------- Árvore de gastos ---------- */
.tree td { padding: 9px 10px; }
.tree .tree-name { display: block; }
.tree .track { height: 5px; background: var(--color-background); border-radius: var(--r-full); overflow: hidden; margin-top: 6px; }
.tree .fill { height: 100%; border-radius: var(--r-full); background: var(--color-accent); }
.tree .lvl-0 td { font-weight: 600; border-top: 1px solid var(--color-border); }
.tree .lvl-0 .fill { background: var(--color-primary); }
.tree .lvl-1 td { border-bottom: 0; }
.tree .lvl-1 + .lvl-0 td, .tree .lvl-2 + .lvl-0 td { border-top: 2px solid var(--color-border); }
.tree .lvl-2 td { border-bottom: 0; color: var(--color-text-soft); font-size: .85rem; padding-top: 4px; padding-bottom: 4px; }
.tree tbody tr td { border-bottom: 0; }
.tree.compact th:first-child { width: auto; }

/* ---------- Tabelas e listas ---------- */
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { text-align: left; font-weight: 500; color: var(--color-text-soft); font-size: .8rem; padding: 0 10px 10px; border-bottom: 1px solid var(--color-border); }
.table td { padding: 12px 10px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table .r { text-align: right; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover td { background: var(--color-soft-light); }

.list { display: flex; flex-direction: column; }
.item {
  display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--color-border);
  background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer;
}
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--color-soft-light); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: .84rem; color: var(--color-text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item.static { cursor: default; }
.item.static:hover { background: none; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: var(--color-soft-light); color: var(--color-primary); border: 1px solid var(--color-primary-soft);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-size: 1.1rem;
}

.badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: var(--r-full); white-space: nowrap; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-late { background: var(--color-bg-dark); color: var(--color-text-on-dark); }
.b-plan { background: var(--color-background); color: var(--color-primary-dark); border: 1px solid var(--color-border); }
.b-est { background: var(--color-soft-light); color: var(--color-primary); border: 1px dashed var(--color-accent); }
.b-mute { background: var(--color-background); color: var(--color-text-soft); }

.month-group { margin-top: 26px; }
.month-group:first-child { margin-top: 0; }
.month-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 2px solid var(--color-primary-dark); }


.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.search {
  flex: 1; min-width: 200px; border: 1px solid var(--color-border); background: var(--color-surface);
  border-radius: var(--r-full); padding: 10px 16px;
}
.total-line { margin-left: auto; font-size: .9rem; color: var(--color-text-soft); }
.total-line b { color: var(--color-text); font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 48px 20px; color: var(--color-text-soft); }
.empty h3 { color: var(--color-text); margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }

.alert { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: var(--r-md); background: var(--color-bg-dark); color: var(--color-text-on-dark); }
.alert .grow { flex: 1; }
.alert .btn { background: var(--color-background); color: var(--color-primary-dark); }

/* ---------- Gaveta (formulários e detalhes) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(42, 18, 21, .38); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 60;
  background: var(--color-surface); visibility: hidden;
  transform: translateX(100%); transition: transform .25s ease, visibility 0s .25s; display: flex; flex-direction: column;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .drawer { transform: none; visibility: visible; transition: transform .25s ease; box-shadow: -10px 0 40px rgba(42, 18, 21, .18); }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--color-border); }
.drawer-head .grow { flex: 1; min-width: 0; }
.drawer-head p { font-size: .88rem; color: var(--color-text-soft); margin-top: 4px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px 28px; }
.drawer-foot { display: flex; gap: 10px; padding: 14px 24px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--color-border); background: var(--color-surface); }
.drawer-foot .spacer { flex: 1; }
.section { margin-top: 26px; }
.section:first-child { margin-top: 0; }
.section > h3 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

/* ---------- Formulários ---------- */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .85rem; font-weight: 500; color: var(--color-text-soft); }
.field input, .field select, .field textarea {
  border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; background: var(--color-surface); width: 100%; min-width: 0;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-soft-light); }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: .78rem; color: var(--color-text-soft); }
.seg { display: flex; border: 1px solid var(--color-border); border-radius: var(--r-full); padding: 3px; gap: 3px; background: var(--color-background); }
.seg-inline { display: inline-flex; }
.seg-inline button { white-space: nowrap; padding: 7px 14px; }
.seg button { flex: 1; border: 0; background: none; border-radius: var(--r-full); padding: 8px 10px; cursor: pointer; font-size: .85rem; color: var(--color-text-soft); }
.seg button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-primary-dark); font-weight: 600; box-shadow: 0 1px 3px rgba(42, 26, 28, .12); }
.box { border: 1px solid var(--color-border); border-radius: var(--r-md); padding: 14px; background: var(--color-background); }
.parc-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.parc-table th { text-align: left; font-weight: 500; color: var(--color-text-soft); font-size: .78rem; padding: 0 6px 6px; }
.parc-table td { padding: 4px 6px; vertical-align: middle; }
.parc-table input { border: 1px solid var(--color-border); border-radius: 8px; padding: 7px 8px; width: 100%; background: #fff; min-width: 0; }
.diff { font-size: .82rem; margin-top: 8px; }
.diff.bad { color: var(--color-primary); font-weight: 600; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--r-full); padding: 5px 6px 5px 12px; font-size: .85rem; }
.tag button svg { width: 13px; height: 13px; }
.tag button { border: 0; background: none; cursor: pointer; color: var(--color-text-soft); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.tag button:hover { background: var(--color-soft-light); color: var(--color-primary); }

/* ---------- Documentos ---------- */
.files { display: flex; flex-direction: column; gap: 2px; }
.file { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px; text-decoration: none; color: var(--color-text); }
.file:hover { background: var(--color-soft-light); }
.file .ext { width: 38px; height: 44px; border-radius: 6px; flex: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: .68rem; font-weight: 700; color: #fff; background: var(--color-accent); }
.file .ext.pdf { background: var(--color-primary); }
.file .ext.img { background: #8A6A4F; }
.file .ext.doc { background: #3E5C8A; }
.file .ext.sheet { background: var(--ok); }
.file .ext.folder { background: var(--color-primary-soft); color: var(--color-primary-dark); align-items: center; padding: 0; }
.file .ext.folder svg { width: 20px; height: 20px; }
.late-date { color: var(--color-primary); font-weight: 600; }
.file .grow { flex: 1; min-width: 0; }
.file .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .92rem; }
.file .s { font-size: .78rem; color: var(--color-text-soft); }
.drop { border: 1.5px dashed var(--color-accent); border-radius: var(--r-md); padding: 16px; text-align: center; background: var(--color-soft-light); color: var(--color-primary-dark); cursor: pointer; display: block; }
.drop input { display: none; }
.progress { height: 4px; background: var(--color-border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; width: 40%; background: var(--color-primary); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.contract { border: 1px solid var(--color-border); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 12px; }
.contract-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.contract .parc { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--color-border); font-size: .88rem; }
.contract .parc:first-of-type { margin-top: 10px; }
.contract .parc .grow { flex: 1; min-width: 0; }


/* ---------- Páginas de cliente e processo ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; color: var(--color-text-soft); margin-bottom: 14px; }
.crumbs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--color-primary); font: inherit; }
.crumbs button:hover { text-decoration: underline; }
.crumbs [aria-current] { color: var(--color-text); }
.page-head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head .grow { flex: 1; min-width: 220px; }
.page-head h1 { font-size: 2.2rem; }
.page-head p { margin-top: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.avatar-lg { width: 64px; height: 64px; font-size: 1.6rem; }
